<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全國秘書會議(南區)</title>
    <style>
        @font-face {
            font-family: 'wt064';
            src: url('wt064.ttf') format('truetype');
            font-weight: 100 900; /* 單一字重，避免瀏覽器自動加粗變形 */
            font-display: block;
        }
        /* --- 基本樣式 (喜氣風格) --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffe0e0 url('00back.jpg') center / cover no-repeat;
            font-family: 'wt064', 'Microsoft JhengHei', sans-serif;
        }

        /* --- 祝福容器 --- */
        .blessing-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* --- 祥福文字方塊樣式 (底圖使用年資對應的圖片) --- */
        .blessing-box {
            position: absolute;
            background-repeat: no-repeat;
            background-position: center;
            background-size: 100% 100%;
            box-sizing: border-box;
            width: 400px; /* 固定名牌大小，不隨文字長度改變 */
            height: 225px;
            padding: 75px 10px 35px; /* 上方留白避開圖片內的年資標籤 */
            opacity: 0; /* 初始為透明 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* --- 更新後的祝福語樣式 --- */
        .blessing-box .message {
            font-size: 2.6rem; /* 實際大小依學校名稱字數由程式設定 */
            color: #c0392b;
            margin-bottom: 10px;
            line-height: 1.3;
            font-weight: 700;
            white-space: nowrap;
        }

        /* --- 更新後的署名樣式 --- */
        .blessing-box .author {
            font-size: 2.2rem;
            color: #333;
            font-weight: 600;
            white-space: nowrap;
        }
        
        /* --- 動畫定義 (改為由左至右) --- */

        /* 由左至右滾動動畫 */
        @keyframes scrollRight {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(100vw);
                opacity: 0;
            }
        }

        /* 隨機浮現動畫 */
        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            15% {
                opacity: 1;
                transform: scale(1);
            }
            85% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.9);
            }
        }

        /* 將動畫應用到方塊上 */
        .animate-scroll-right {
            animation-name: scrollRight;
            animation-timing-function: linear;
        }

        .animate-fade-in-out {
            animation-name: fadeInOut;
            animation-timing-function: ease-in-out;
        }
    </style>
</head>
<body>

    <div class="blessing-container" id="blessing-container">
        <!-- 祝福語將會動態插入此處 -->
    </div>

    <script>
        // --- 設定 ---
        // 請將 'YOUR_GOOGLE_SHEET_CSV_URL' 替換成您從 Google Sheets 發布到網路後取得的 CSV 網址
        const GOOGLE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1KSjU0ki9oBc_5sEf_cTb2HG3nlqy2lN8D28xYTLFf8I/export?format=csv&gid=323350486';

        // 每隔多少毫秒顯示一則新的祝福
        const NEW_BLESSING_INTERVAL = 3000; // 3 秒
        
        // 每隔多少毫秒重新從 Google Sheet 抓取一次最新資料
        const DATA_REFRESH_INTERVAL = 10000; // 10 秒

        // 名牌可出現的範圍（佔畫面的百分比），上方避開標題、下方避開承辦單位文字
        const SAFE_TOP_PERCENT = 9;
        const SAFE_BOTTOM_PERCENT = 92;
        const SAFE_LEFT_PERCENT = 2;
        const SAFE_RIGHT_PERCENT = 98;

        // --- 程式碼 ---
        const container = document.getElementById('blessing-container');
        let blessings = [];
        let displayQueue = []; // 用於播放的祝福佇列

        // Fisher-Yates 洗牌演算法，用於打亂陣列順序
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [
                    array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // 1. 從 Google Sheet 載入資料
        async function loadBlessings() {
            console.log("正在從 Google Sheet 更新資料...");
            let newBlessings = [];
            
            if (GOOGLE_SHEET_URL === 'YOUR_GOOGLE_SHEET_CSV_URL' && blessings.length === 0) {
                 console.error("提醒：您正在使用範例資料。若要顯示您自己的祝福語，請替換 GOOGLE_SHEET_URL。");
                newBlessings = [
                    { message: '感謝校長多年來的無私奉獻與卓越領導，祝您未來一切順心！', author: '教育部 - 王小明' },
                    { message: '春風化雨，桃李滿門。您的教誨我們將永遠銘記在心。', author: 'XX大學 校友會 - 陳大華' },
                    { message: '恭喜校長開啟人生的新篇章，願您退而不休，生活多采多姿！', author: 'OO企業 董事長 - 林美麗' },
                    { message: '您的智慧與遠見，為學校奠定了堅實的基礎。祝福您！', author: '家長會 會長 - 張先生' },
                ];
            } else {
                 try {
                    const response = await fetch(`${GOOGLE_SHEET_URL}&t=${new Date().getTime()}`); // 加上時間戳避免快取
                    const csvText = await response.text();
                    const rows = csvText.split(/\r?\n/).slice(1);
                    
                    newBlessings = rows.map(row => {
                        // 使用更複雜的CSV解析來處理可能包含逗號的內容
                        const columns = parseCSVRow(row);
                        
                        if (columns.length >= 6) {
                            // 欄位順序：時間戳記、學校或單位、姓名、職稱、累計年資、確認發布
                            const school = columns[1].trim();
                            const name = columns[2].trim();
                            const seniorityYears = parseInt(columns[4].trim(), 10) || 0; // 年資欄位，用來判斷分級
                            const published = columns[5].trim(); // 確認發布欄位
                            
                            // 只有當『確認發布』欄位為『V』時才納入顯示
                            if (published === 'V' && school && name) {
                                return {
                                    school: school,
                                    name: name,
                                    tierImage: getSeniorityImage(seniorityYears)
                                };
                            }
                        }
                        return null;
                    }).filter(b => b !== null);
                    
                } catch (error) {
                    console.error('無法載入或解析 Google Sheet 資料:', error);
                }
            }
            
            blessings = newBlessings;
            console.log(`資料更新完畢，共 ${blessings.length} 則已確認發布的祝福。`);
        }

        // 簡單的CSV解析函數，處理包含逗號和引號的內容
        function parseCSVRow(row) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < row.length; i++) {
                const char = row[i];
                
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            
            result.push(current); // 加入最後一欄
            return result;
        }

        // 根據年資判斷對應的底圖圖片檔名
        function getSeniorityImage(years) {
            if (years >= 10) return '04.gif';
            if (years >= 7) return '03.gif';
            if (years >= 4) return '02.png';
            return '01.png';
        }

        // 根據學校名稱字數決定字型大小(rem)
        function getSchoolFontSize(text) {
            const length = Array.from(text.replace(/\s/g, '')).length;
            if (length <= 6) return 2.6;
            if (length <= 8) return 2.4;
            if (length <= 10) return 2.2;
            return 2.0;
        }

        // 2. 創建並顯示祝福方塊
        function displayBlessing() {
            if (blessings.length === 0) {
                console.log("目前沒有已確認發布的祝福語可顯示");
                return;
            }

            if (displayQueue.length === 0) {
                console.log("佇列已播完，重新洗牌！");
                displayQueue = shuffleArray([...blessings]);
            }

            const blessingData = displayQueue.pop();
            if (!blessingData) return;

            const box = document.createElement('div');
            box.className = 'blessing-box';
            box.style.backgroundImage = `url('${blessingData.tierImage}')`;
            box.innerHTML = `
                <div class="message" style="font-size: ${getSchoolFontSize(blessingData.school)}rem">${blessingData.school}</div>
                <div class="author">${blessingData.name}</div>
            `;

            const animationType = Math.random() > 0.5 ? 'scroll' : 'fade';
            const duration = Math.random() * 15 + 20; // 20 到 35 秒

            if (animationType === 'scroll') {
                box.classList.add('animate-scroll-right');
                box.style.animationDuration = `${duration}s`;
            } else {
                box.classList.add('animate-fade-in-out');
                box.style.animationDuration = `${duration * 0.6}s`;
            }

            container.appendChild(box);

            // 依名牌實際尺寸，把位置限制在安全範圍內，避免遮到背景圖的文字
            const areaTop = container.clientHeight * SAFE_TOP_PERCENT / 100;
            const areaBottom = container.clientHeight * SAFE_BOTTOM_PERCENT / 100;
            const maxTop = Math.max(areaTop, areaBottom - box.offsetHeight);
            box.style.top = `${areaTop + Math.random() * (maxTop - areaTop)}px`;

            if (animationType === 'fade') {
                const areaLeft = container.clientWidth * SAFE_LEFT_PERCENT / 100;
                const areaRight = container.clientWidth * SAFE_RIGHT_PERCENT / 100;
                const maxLeft = Math.max(areaLeft, areaRight - box.offsetWidth);
                box.style.left = `${areaLeft + Math.random() * (maxLeft - areaLeft)}px`;
            }

            box.addEventListener('animationend', () => {
                box.remove();
            });
        }

        // --- 啟動 ---
        window.addEventListener('load', async () => {
            await loadBlessings();
            if (blessings.length > 0) {
                displayBlessing();
                setInterval(displayBlessing, NEW_BLESSING_INTERVAL);
                setInterval(loadBlessings, DATA_REFRESH_INTERVAL);
            } else {
                console.warn("沒有已確認發布的祝福資料。");
            }
        });
    </script>

</body>
</html>
